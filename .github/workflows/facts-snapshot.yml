# Unattended facts refresh (GAMES_ROADMAP, "patch-cadence pipeline"):
# re-snapshots the Meraki skin-facts dataset twice a week and opens a PR
# when the data actually changed (the snapshot script is idempotent — no
# timestamp churn). League patches land ~biweekly, so this catches new
# skins, price changes, and legacy-vaulting within a few days.
#
# Alerting falls out for free: if Meraki breaks or moves, the run fails and
# GitHub emails the failure — staleness never goes silent. The snapshot
# script also refuses to write a mostly-empty dataset, so a half-broken CDN
# can't replace good data.
name: facts-snapshot

on:
  schedule:
    - cron: '0 6 * * 1,4' # Mon + Thu, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh the facts snapshot
        run: node web/scripts/snapshot-facts.mjs
      - name: Open a PR if the data changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/facts-snapshot
          title: 'chore: refresh skin-facts snapshot'
          commit-message: |
            chore: refresh skin-facts snapshot

            Automated Meraki re-snapshot (facts-snapshot workflow).
          body: |
            Automated skin-facts refresh from the Meraki Analytics CDN.

            Review the diff for new skins, price changes, and
            legacy-vaulting, then merge — Price Check pools, skin pages,
            the Drought Index, and the Mirror's skin-line taste profile
            all read this dataset.
          delete-branch: true
